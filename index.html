:root[data-theme="dark"]{--bg:#10131a;--card:#181d27;--tx:#e8ecf4;--mut:#9aa5b8;--pri:#7c9bff;--pri2:#222b45;--bd:#2a3140;--ok:#43c88b;--hl:#6b5b10;--en:#8db8ff}

.res{display:none}.res.show{display:block}.res a{display:block;padding:12px 14px;margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;color:var(--tx);cursor:pointer;line-height:1.7;font-size:15px}

<script id="d" type="application/json">[{"unit": "الوحدة الأولى", "title": "The Present Perfect Simple – المضارع التام البسيط", "p": ["أولاً: بنستخدمه إمتى؟ - حدث بدأ في الماضي ولسه مستمر لحد دلوقتي. - حدث حصل وانتهى لكن ليه أثر في الحاضر. - حدث حصل من غير ما نحدد إمتى. - حدث اتكرر وعدد مرات تكراره مهم.", "التكوين: فاعل + have / has + التصريف الثالث للفعل (PP)", "I / You / We / They → have He / She / It → has", "أمثلة: I have eaten. الترجمة: أنا أكلت.", "He has finished his work. الترجمة: هو أنهى عمله.", "استخدامات وأمثلة: 1. حدث بدأ في الماضي ولسه مستمر: He has lived in Cairo since 2008. هو يعيش في القاهرة منذ عام 2008، وما زال يعيش فيها.", "2.  حدث انتهى ولكن أثره موجود: I have lost my keys. لقد أضعت مفاتيحي، يعني مش لاقيها دلوقتي.", "3.  حدث بدون تحديد وقت: My father has bought a new car. والدي اشترى سيارة جديدة.", "4.  التكرار أو وجود رقم: I have called you twice. اتصلت بك مرتين.", "الكلمات الدالة: Since = منذ (بداية وقت) For = لمدة Already = بالفعل Just = للتو / حالاً Yet = حتى الآن Recently = حديثاً Lately = مؤخراً So far = حتى الآن Never = أبداً Ever = في أي وقت", "أمثلة: I have just eaten. = لقد أكلت للتو. He hasn’t finished yet. = هو لم ينتهِ حتى الآن. I have never visited Aswan. = لم أزر أسوان أبداً."], "id": 1}, {"unit": "الوحدة الأولى", "title": "الفرق بين Been و Gone", "p": ["Has gone to = ذهب ولم يعد. Has been to = ذهب وعاد. Has been in = موجود في مكان.", "She has gone to France. هي ذهبت إلى فرنسا ولم تعد حتى الآن.", "She has been to France. هي ذهبت إلى فرنسا وعادت.", "She has been in France for 7 years. هي موجودة في فرنسا منذ 7 سنوات."], "id": 2}, {"unit": "الوحدة الأولى", "title": "الفرق بين Ever و Never", "p": ["Ever = هل سبق لك؟ وتستخدم غالباً في السؤال. Never = لم يحدث أبداً.", "Have you ever ridden a camel? هل سبق لك ركوب جمل؟", "I have never ridden a camel. أنا لم أركب جملاً أبداً."], "id": 3}, {"unit": "الوحدة الأولى", "title": "الفرق بين Since و For", "p": ["Since: بداية وقت محدد. أمثلة: Since 2005 = منذ 2005 Since Monday = منذ الاثنين Since January = منذ يناير Since yesterday = منذ أمس", "For: مدة زمنية. أمثلة: For 3 days = لمدة 3 أيام For 5 years = لمدة 5 سنوات For 2 hours = لمدة ساعتين For a month = لمدة شهر", "قاعدة للحفظ: لو لقيت بداية وقت محدد → Since. لو لقيت مدة زمنية → For.", "I have lived here since 2020. أنا أعيش هنا منذ 2020.", "I have lived here for six years. أنا أعيش هنا لمدة ست سنوات."], "id": 4}, {"unit": "الوحدة الأولى", "title": "Present Perfect Continuous – المضارع التام المستمر", "p": ["التكوين: فاعل + have / has + been + verb-ing", "بنستخدمه لما نكون مهتمين بالحدث نفسه واستمراره أو مدته.", "He has been studying for three hours. هو يذاكر منذ ثلاث ساعات.", "الفرق بين المضارع التام البسيط والمستمر: - المضارع التام البسيط: have/has + PP، يهتم بالنتيجة أو الإنجاز. - المضارع التام المستمر: have/has been + ing، يهتم بالحدث ومدته واستمراره.", "أمثلة: She has bought fruit. هي اشترت الفاكهة. التركيز على النتيجة.", "She has been shopping. هي تتسوق منذ فترة. التركيز على نشاط التسوق.", "He has read all the letters. هو قرأ كل الخطابات.", "He has been reading all the evening. هو يقرأ طوال المساء.", "نختار المضارع التام المستمر غالباً مع: - All + مدة زمنية. - For + مدة زمنية + Now. - الكلام عن الحدث نفسه.", "نختار المضارع التام البسيط غالباً مع: - All + مفعول به. - النتيجة النهائية أو الإنجاز. - عدد مرات حدوث الفعل. - أفعال الحالة مثل Know = يعرف.", "I have known Ali for ten years. أنا أعرف علي منذ عشر سنوات. لا نقول: have been knowing."], "id": 5}, {"unit": "الوحدة الثانية", "title": "Reported Speech – الكلام غير المباشر (مقدمة)", "p": ["معناه: نقل كلام شخص آخر أو حكاية ما قاله.", "مثال: “I am happy.” أنا سعيد.", "He said that he was happy. هو قال إنه كان سعيداً."], "id": 6}, {"unit": "الوحدة الثانية", "title": "Statements – الجمل الخبرية", "p": ["الخطوات: 1. نحول said to إلى told. 2. نربط الجملة بكلمة that. 3. نغير الضمائر والأزمنة.", "مثال: He said to me, “I am happy.” هو قال لي: أنا سعيد.", "He told me that he was happy. هو أخبرني أنه كان سعيداً.", "تحويلات الأزمنة: Present Simple → Past Simple am / is → was are → were Present Continuous → Past Continuous Past Simple → Past Perfect Present Perfect → Past Perfect will → would can → could", "مثال: She said, “I will visit my uncle.” هي قالت: سأزور عمي.", "She said that she would visit her uncle. هي قالت إنها ستزور عمها.", "تحويل كلمات الزمن والمكان: Now → Then = الآن → حينها Today → That day = اليوم → ذلك اليوم Tomorrow → The following day = غداً → اليوم التالي Yesterday → The previous day = أمس → اليوم السابق Tonight → That night = الليلة → تلك الليلة Here → There = هنا → هناك This → That = هذا → ذلك These → Those = هؤلاء → أولئك Next week → The following week = الأسبوع القادم → الأسبوع التالي Last week → The week before = الأسبوع الماضي → الأسبوع السابق Ago → Before = منذ → قبل"], "id": 7}, {"unit": "الوحدة الثانية", "title": "Orders or Instructions – الأوامر والتعليمات", "p": ["الخطوات: - said to تتحول إلى told أو ordered. - نستخدم to قبل الفعل. - نغير الضمائر حسب المعنى.", "التكوين: told / ordered + المفعول + to + المصدر", "مثال: His father said to him, “Iron your clothes.” والده قال له: اكْوِ ملابسك.", "His father told him to iron his clothes. والده أخبره أن يكوي ملابسه.", "لو الأمر منفي وفيه Don’t: التكوين: told + المفعول + not to + المصدر", "“Don’t forget your homework.” لا تنسَ واجبك.", "He told me not to forget my homework. هو طلب مني ألا أنسى واجبي."], "id": 8}, {"unit": "الوحدة الثانية", "title": "Request – الطلب", "p": ["نحول said to إلى asked.", "التكوين: asked + المفعول + to + المصدر", "She said to him, “Give me your pen, please.” هي قالت له: أعطني قلمك من فضلك.", "She asked him to give her his pen. هي طلبت منه أن يعطيها قلمه.", "في الطلب المنفي: asked + المفعول + not to + المصدر", "He asked her not to tell his dad. هو طلب منها ألا تخبر والده."], "id": 9}, {"unit": "الوحدة الثانية", "title": "Wh Questions – السؤال بأداة استفهام", "p": ["أدوات الاستفهام: What = ماذا Where = أين When = متى Why = لماذا Who = من How = كيف", "الخطوات: 1. said to تتحول إلى asked. 2. أداة الاستفهام تظل كما هي. 3. نحول السؤال إلى جملة خبرية. 4. نحذف do / does / did. 5. نغير الزمن والضمائر.", "مثال: “What are you doing now?” ماذا تفعل الآن؟", "I asked him what he was doing then. سألته ماذا كان يفعل حينها.", "نقول: What he was doing ولا نقول: What was he doing لأننا حولنا السؤال إلى جملة خبرية."], "id": 10}, {"unit": "الوحدة الثانية", "title": "Yes / No Questions – السؤال بفعل مساعد", "p": ["دي الأسئلة اللي إجابتها غالباً Yes أو No. نستخدم رابط If أو Whether، ومعناهما: إذا / ما إذا.", "مثال: “Are you visiting your uncle tomorrow?” هل ستزور عمك غداً؟", "I asked him if he was visiting his uncle the following day. سألته إذا كان سيزور عمه في اليوم التالي.", "مثال: “Did you go to school yesterday?” هل ذهبت إلى المدرسة أمس؟", "He asked her if she had gone to school the previous day. هو سألها إذا كانت قد ذهبت إلى المدرسة في اليوم السابق.", "ملاحظات مهمة: - مع then أو at that moment نستخدم غالباً الماضي المستمر. - مع before أو previous نستخدم غالباً الماضي التام. - مع following أو next نستخدم would أو الماضي المستمر حسب المعنى. - لو وجدنا or not نستخدم whether. - لو فعل القول مضارع مثل says أو tells، غالباً لا نغير زمن الجملة المنقولة. - لو بنتكلم عن حقيقة علمية ثابتة، نتركها مضارع بسيط.", "مثال حقيقة علمية: The teacher said, “The earth goes round the sun.” المعلم قال: الأرض تدور حول الشمس.", "The teacher said that the earth goes round the sun. المعلم قال إن الأرض تدور حول الشمس."], "id": 11}, {"unit": "الوحدة الثالثة", "title": "Deduction – الاستنتاج", "p": ["يعني تشوف حاجة وتستنتج منها حاجة تانية.", "أولاً: الاستنتاج في المضارع: Must = متأكد إنه كذلك. Can’t = متأكد إنه ليس كذلك. May = ربما. Might = ربما. Could = من الممكن.", "أمثلة: He must be rich. هو بالتأكيد غني.", "He can’t be poor. من المستحيل أن يكون فقيراً.", "He may be ill. ربما يكون مريضاً.", "للحفظ: Must = تأكيد. Can’t = نفي التأكيد. May / Might / Could = احتمال.", "ثانياً: الاستنتاج في الماضي: Must have + PP = بالتأكيد حدث. Can’t have + PP = بالتأكيد لم يحدث. Couldn’t have + PP = من المستحيل أنه حدث. May have + PP = ربما حدث. Might have + PP = ربما حدث. Could have + PP = من المحتمل أنه حدث.", "أمثلة: He got high marks. He must have studied hard. حصل على درجات عالية. بالتأكيد ذاكر بجد.", "He missed the bus. He can’t have got up early. فاته الأتوبيس. بالتأكيد لم يستيقظ مبكراً.", "في المبني للمجهول نضيف been: Must have been + PP Can’t have been + PP May have been + PP", "It must have been made by hand. بالتأكيد تم صنعه يدوياً."], "id": 12}, {"unit": "الوحدة الثالثة", "title": "Giving Advice – إعطاء النصيحة", "p": ["التعبيرات: Should = ينبغي. Ought to = ينبغي. Had better = من الأفضل. It’s advisable to = يُنصح بأن. It’s desirable to = من المرغوب أن. I advise you to = أنصحك أن. My advice is to = نصيحتي أن.", "بعد التعبيرات دي نستخدم الفعل في المصدر.", "أمثلة: You should study hard. ينبغي أن تذاكر بجد.", "You had better exercise. من الأفضل أن تمارس الرياضة.", "النصيحة بالنفي: Shouldn’t Oughtn’t to Had better not I advise you not to", "You shouldn’t stay up late. لا ينبغي أن تسهر لوقت متأخر.", "I advise you not to stay up late. أنصحك ألا تسهر لوقت متأخر."], "id": 13}, {"unit": "الوحدة الثالثة", "title": "Blame and Regret – اللوم والندم", "p": ["الحالة الأولى: كان المفروض يعمل حاجة لكنه لم يفعلها. Should have + PP Ought to have + PP", "He should have studied hard. كان ينبغي أن يذاكر بجد. المعنى: هو لم يذاكر بجد، ونندم أو نلومه على ذلك.", "الحالة الثانية: فعل شيئاً وكان المفروض ألا يفعله. Shouldn’t have + PP Oughtn’t to have + PP", "He shouldn’t have got up late. ما كان ينبغي أن يستيقظ متأخراً. المعنى: هو استيقظ متأخراً، وكان هذا تصرفاً خاطئاً.", "للحفظ: Should have = كان المفروض يعمل، لكنه لم يفعل. Shouldn’t have = كان المفروض ألا يعمل، لكنه فعل."], "id": 14}, {"unit": "الوحدة الرابعة", "title": "Adverbs – الظروف أو الحال", "p": ["الظرف كلمة بتوصف الفعل، وبتقول لنا الفعل حصل إزاي.", "مثال: He walks slowly. هو يمشي ببطء. Slowly بتوصف طريقة المشي.", "تكوين الظروف: غالباً بنضيف ly للصفة عشان نحولها إلى ظرف.", "Slow → Slowly = بطيء / ببطء Quick → Quickly = سريع / بسرعة Careful → Carefully = حذر / بحذر Beautiful → Beautifully = جميل / بشكل جميل", "مثال: He runs quickly. هو يجري بسرعة."], "id": 15}, {"unit": "الوحدة الرابعة", "title": "Adverbs of Degree – ظروف الدرجة", "p": ["بتوضح مدى قوة الصفة أو الظرف.", "Quite = إلى حد ما Rather = إلى حد ما Very = جداً Extremely = للغاية Absolutely = تماماً Really = حقاً / جداً", "أمثلة: He is extremely tall. هو طويل للغاية.", "He runs very fast. هو يجري بسرعة كبيرة.", "ظرف الدرجة يأتي قبل الصفة أو الظرف الذي يقويه."], "id": 16}, {"unit": "الوحدة الرابعة", "title": "Irregular Adverbs – الظروف الشاذة", "p": ["Good → Well = جيد / جيداً Fast → Fast = سريع / بسرعة Hard → Hard = شاق أو صعب / بجد Early → Early = مبكر / مبكراً Late → Late = متأخر / متأخراً", "أمثلة: She is a good cook. هي طباخة جيدة.", "She cooks well. هي تطبخ جيداً."], "id": 17}, {"unit": "الوحدة الرابعة", "title": "الفرق بين Hard و Hardly", "p": ["Hard = بجد أو بشدة. Hardly = بالكاد / تقريباً لا.", "He is studying hard. هو يذاكر بجد.", "He hardly studies. هو بالكاد يذاكر."], "id": 18}, {"unit": "الوحدة الرابعة", "title": "كلمة Well", "p": ["ممكن تيجي بمعنى بصحة جيدة.", "How are you? = كيف حالك؟ I’m well. = أنا بخير."], "id": 19}, {"unit": "الوحدة الرابعة", "title": "Adjectives – الصفات", "p": ["الصفة بتوصف الاسم، يعني بتقول لنا الشخص أو الشيء صفته إيه.", "مثال: Taher is a clever boy. طاهر ولد ذكي. Clever صفة لأنها بتوصف الولد.", "أماكن وجود الصفة: - قبل الاسم: A beautiful girl = فتاة جميلة. - بعد أفعال مثل: Be, Become, Get, Feel, Look, Seem, Smell, Taste, Sound.", "أمثلة: The food smells good. رائحة الطعام جيدة.", "He looks strange. هو يبدو غريباً.", "الفرق بين الصفة والظرف: He is a quick runner. = هو عداء سريع. He runs quickly. = هو يجري بسرعة.", "لو الكلمة بتوصف اسماً → صفة. لو بتوصف فعلاً → ظرف."], "id": 20}, {"unit": "الوحدة الرابعة", "title": "The + Adjective", "p": ["أحياناً نضع The قبل الصفة فتصبح بمعنى فئة من الناس.", "The rich = الأغنياء The poor = الفقراء The young = صغار السن The old = كبار السن The disabled = ذوو الإعاقة", "مثال: The rich should help the poor. ينبغي على الأغنياء مساعدة الفقراء."], "id": 21}, {"unit": "الوحدة الرابعة", "title": "Compound Adjectives – الصفات المركبة", "p": ["صفة بتتكون من كلمتين أو أكثر، وغالباً بنحط بينهم شرطة (-).", "A well-known player. لاعب مشهور.", "ملاحظات: - الصفة المركبة قبل الاسم: A light-coloured shirt = قميص فاتح اللون. - عند الحديث عن العمر: An eight-year-old boy = ولد عمره 8 سنوات. - Year وليس Years في الصفة المركبة الخاصة بالعمر. - Well-known = مشهور. - Ill-fated = سيئ الحظ. - Badly injured = مصاب بشدة. - Badly hurt = متألم بشدة. - Neatly cut = مقصوص بشكل مرتب. - Totally ignored = تم تجاهله تماماً. - Worn-out = بالٍ / متهالك. - Well-off = ميسور الحال / غني."], "id": 22}, {"unit": "الوحدة الخامسة", "title": "Causative Sentences – الجمل السببية", "p": ["معناها إنك بتخلي شخص تاني يعمل حاجة بدلاً منك، أو بتطلب منه يعملها.", "مثال: عندك ماسورة مكسورة وجبت سباك يصلحها. أنت مش اللي صلحت الماسورة، السباك هو اللي صلحها.", "الشكل الأول: Have / Make / Let / Help + مفعول به + المصدر", "معاني الأفعال: Have = يجعل / يطلب من Make = يجبر Let = يسمح Help = يساعد", "مثال: I had a plumber fix the broken pipe. طلبت من سباك إصلاح الماسورة المكسورة.", "بعد plumber استخدمنا fix بدون to.", "الشكل الثاني: Get / Allow / Help / Cause / Force / Advise / Encourage + مفعول به + to + المصدر", "معاني الكلمات: Get = يجعل شخصاً يفعل. Allow = يسمح. Cause = يتسبب في. Force = يجبر. Advise = ينصح. Encourage = يشجع.", "مثال: I got a plumber to fix the broken pipe. جعلت سباكاً يصلح الماسورة المكسورة.", "لاحظ وجود to قبل fix.", "الشكل الثالث: Have / Get + المفعول به + التصريف الثالث PP", "معناه إن شخصاً آخر قام بالعمل.", "مثال: I had the broken pipe fixed by the plumber. جعلت الماسورة المكسورة تُصلح بواسطة السباك.", "مقارنة الأشكال الثلاثة: I had him fix it. استخدمنا Have + شخص + مصدر.", "I got him to fix it. استخدمنا Get + شخص + to + مصدر.", "I had it fixed. استخدمنا Have + شيء + التصريف الثالث."], "id": 23}, {"unit": "مراجعة", "title": "ملخص سريع للحفظ قبل الامتحان", "p": ["Present Perfect: have / has + PP", "Present Perfect Continuous: have / has + been + ing", "Reported Speech: تغيير الضمائر والأزمنة وكلمات الزمن والمكان حسب القاعدة.", "Deduction في المضارع: must / can’t / may + مصدر", "Deduction في الماضي: must / can’t / may + have + PP", "Advice: should + مصدر", "Regret: should have + PP", "Adverb: غالباً صفة + ly", "Causative: have / get + شخص أو شيء + الفعل المناسب."], "id": 24}, {"unit": "مراجعة", "title": "نصائح للمذاكرة", "p": ["1.  متحاولش تحفظ كل الوحدات مرة واحدة. 2.  افهم قاعدة واحدة واحفظ شكلها. 3.  ترجم الأمثلة وافهم معنى كل جملة. 4.  حل أسئلة على كل قاعدة قبل ما تنتقل للي بعدها. 5.  راجع الكلمات الدالة لأنها بتساعدك تختار الإجابة الصحيحة. 6.  احفظ التصريفات الثلاثة للأفعال المهمة؛ لأن قواعد كثيرة بتحتاج التصريف الثالث."], "id": 25}]</script>
<script>
const S=JSON.parse(document.getElementById('d').textContent);
let done=new Set(),cur=1;
try{done=new Set(JSON.parse(localStorage.getItem('gdone')||'[]'))}catch(e){}
const sv=()=>{try{localStorage.setItem('gdone',JSON.stringify([...done]))}catch(e){}};
const $=i=>document.getElementById(i);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isEn=t=>(t.match(/[A-Za-z]/g)||[]).length>(t.match(/[\u0600-\u06FF]/g)||[]).length;
function hl(t,q){t=esc(t);if(!q)return t;const r=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return t.replace(r,'<mark>$1</mark>')}
function buildNav(){let h='',u='';S.forEach(s=>{if(s.unit!==u){u=s.unit;h+=`<h3>${u}</h3>`}h+=`<a data-i="${s.id}" class="${done.has(s.id)?'done':''} ${s.id===cur?'on':''}"><span class="n">${done.has(s.id)?'✓':s.id}</span><span>${esc(s.title)}</span></a>`});$('nav').innerHTML=h;
const p=Math.round(done.size/S.length*100);$('pb').style.width=p+'%'}
function show(i,q){cur=i;const s=S.find(x=>x.id===i);$('res').classList.remove('show');$('view').style.display='';
let h=`<div class="card"><div class="u">${s.unit} • الجزء ${s.id} من ${S.length}</div><h2>${hl(s.title,q)}</h2>`;
s.p.forEach(t=>h+=`<p class="${isEn(t)?'en':''}">${hl(t,q)}</p>`);
h+=`<div class="acts">${i>1?'<button id="pv">→ السابق</button>':''}<button class="p" id="nx">${i<S.length?'خلّصت الجزء ده – كمّل للي بعده ←':'خلّصت الشرح كله 🎉'}</button></div></div>`;
$('view').innerHTML=h;
$('nx').onclick=()=>{done.add(i);sv();if(i<S.length){go(i+1)}else buildNav()};
if($('pv'))$('pv').onclick=()=>go(i-1);
buildNav();$('nav').classList.remove('open');
try{history.replaceState(null,'','#s'+i)}catch(e){}
window.scrollTo(0,0);const on=document.querySelector('nav a.on');if(on)on.scrollIntoView({block:'nearest'})}
function go(i){$('q').value='';show(i,'')}
$('nav').onclick=e=>{const a=e.target.closest('a');if(a)go(+a.dataset.i)};
$('menu').onclick=()=>$('nav').classList.toggle('open');
$('th').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
$('q').oninput=()=>{const q=$('q').value.trim();if(!q){show(cur,'');return}
const ql=q.toLowerCase();const hits=S.filter(s=>(s.title+' '+s.p.join(' ')).toLowerCase().includes(ql));
$('view').style.display='none';const r=$('res');r.classList.add('show');
r.innerHTML=hits.length?`<p class="u">${hits.length} نتيجة</p>`+hits.map(s=>{const t=s.p.find(x=>x.toLowerCase().includes(ql))||'';const k=t.toLowerCase().indexOf(ql);const sn=k>=0?t.slice(Math.max(0,k-50),k+90):'';
return `<a data-i="${s.id}"><b>${s.id}. ${hl(s.title,q)}</b><span>${s.unit}${sn?' — … '+hl(sn,q)+' …':''}</span></a>`}).join(''):'<p class="u">مفيش نتائج.</p>';
r.querySelectorAll('a').forEach(a=>a.onclick=()=>{const i=+a.dataset.i;cur=i;$('view').style.display='';show(i,q)})};
const m=/^#s(\d+)$/.exec(location.hash);show(m&&S.some(s=>s.id===+m[1])?+m[1]:1,'');
</script>
